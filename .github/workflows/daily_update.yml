name: Daily Portfolio Content Updater

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Auto-Update Script
        run: python update_portfolio.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: auto-refresh dynamic tech feed [skip ci]" || exit 0
          git push
